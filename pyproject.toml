[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aie-decision"
version = "0.2.0"
description = "Experimental infrastructure for auditable Fermi decomposition"
requires-python = ">=3.12"

[project.scripts]
aie-decision = "aie_decision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
